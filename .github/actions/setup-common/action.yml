name: "Common setup for all OSes"
description: "Installs common dependencies"
inputs:
  codec-rav1e:
    description: "Can take the values: OFF, LOCAL, SYSTEM"
    default: "OFF"
  oldest-cmake:
    description: "Can take the values: true, false. Only useful on Linux to force using the minimum required CMake"
    default: "false"
runs:
  using: "composite"
  steps:
    # Python 3, modern CMake, Ninja, and stable Rust are preinstalled on all
    # GitHub-hosted Linux, macOS, and Windows runners. Only install CMake when
    # testing the minimum supported version.
    - name: Set up CMake 3.22
      if: ${{ runner.os == 'Linux' && inputs.oldest-cmake == 'true' }}
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
      with:
        # Use the minimum required version of cmake.
        cmake-version: "3.22.x"
    - name: Print CMake version
      run: cmake --version
      shell: bash
    - name: Set up cargo-c
      if: ${{ inputs.codec-rav1e == 'LOCAL' }}
      run: |
        if (-not (Get-Command cargo-cinstall -ErrorAction SilentlyContinue)) {
          cargo install --locked cargo-c --features=vendored-openssl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      shell: pwsh

# This is a copy of ci-unix-shared-local.yml for building shared libraries
# with an additional build configuration (using installed deps and dav1d).

name: CI MinGW
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: ${{ github.ref != 'refs/heads/main' }}
      matrix:
        sys:
          - ucrt64
          - clang64

    name: build-mingw

    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.sys }}
          update: false
          install: >-
            git
          pacboy: >-
            aom:p
            cc:p
            ccache:p
            cmake:p
            dav1d:p
            diffutils:p
            imagemagick:p
            libjpeg-turbo:p
            libpng:p
            libyuv:p
            ninja:p
            zlib:p
      - name: Configure ccache
        run: |
          CCACHE_PATH="$(cygpath -m "$RUNNER_TEMP")/ccache"
          mkdir -p "$CCACHE_PATH"
          echo "CCACHE_DIR=$CCACHE_PATH" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mingw-${{ matrix.sys }}-${{ hashFiles('cmake/Modules/Local*', 'src/**', 'apps/**', 'tests/**') }}
          restore-keys: |
            ccache-mingw-${{ matrix.sys }}-
      - name: Print cmake version
        run: cmake --version

      - name: Prepare libavif (cmake)
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DAVIF_CODEC_AOM=SYSTEM
          -DAVIF_CODEC_AOM_DECODE=OFF -DAVIF_CODEC_AOM_ENCODE=ON
          -DAVIF_CODEC_DAV1D=SYSTEM
          -DAVIF_LIBSHARPYUV=LOCAL -DAVIF_LIBYUV=SYSTEM
          -DAVIF_BUILD_EXAMPLES=ON -DAVIF_BUILD_APPS=ON
          -DAVIF_BUILD_TESTS=ON -DAVIF_GTEST=LOCAL
          -DAVIF_BUILD_GDK_PIXBUF=ON
          -DAVIF_ENABLE_WERROR=ON
      - name: Build libavif
        run: cmake --build build --config Release --parallel
      - name: Run AVIF Tests
        working-directory: ./build
        run: ctest -j $(nproc) --output-on-failure

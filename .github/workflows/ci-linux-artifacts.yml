# This workflow generates artifacts such as avifenc and avifdec for convenience.

name: CI Linux Release Artifacts
on:
  release:
    types: [created]

permissions: {}

jobs:
  build-linux-artifacts:
    permissions:
      contents: read
      id-token: write
      attestations: write
      # artifact-metadata is not needed because push-to-registry is not enabled.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    name: build-linux-artifacts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          codec-aom: "LOCAL"
          codec-dav1d: "LOCAL"
          libyuv: "LOCAL"

      - name: Prepare libavif (cmake)
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DAVIF_CODEC_AOM=LOCAL -DAVIF_CODEC_AOM_ENCODE=ON
          -DAVIF_CODEC_AOM_DECODE=OFF -DAVIF_CODEC_DAV1D=LOCAL
          -DAVIF_LIBSHARPYUV=LOCAL -DAVIF_LIBYUV=LOCAL
          -DAVIF_ZLIBPNG=LOCAL -DAVIF_JPEG=LOCAL
          -DAVIF_BUILD_EXAMPLES=OFF -DAVIF_BUILD_APPS=ON
          -DAVIF_BUILD_TESTS=OFF -DAVIF_ENABLE_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build libavif
        run: cmake --build build --config Release --parallel 4
      - name: Archive artifacts
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: zip
          filename: linux-artifacts.zip
          directory: build
          path: |
            avifenc
            avifdec
            avifgainmaputil
      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/linux-artifacts.zip

      - name: Upload ZIP for release publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-artifacts
          path: build/linux-artifacts.zip
          if-no-files-found: error
          compression-level: 0

  publish-linux-artifacts:
    needs: build-linux-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ZIP for release publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-artifacts
          path: release-assets
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload -- "$RELEASE_TAG" release-assets/linux-artifacts.zip
